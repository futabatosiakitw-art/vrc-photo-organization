<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>フタバとシアキの工房 - VRC Photo Editor</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root { --bg-color: #1e1e1e; --panel-bg: #2d2d2d; --text-color: #f0f0f0; --accent: #4a90e2; }
    body { margin: 0; padding: 20px; font-family: sans-serif; background-color: var(--bg-color); color: var(--text-color); display: flex; gap: 20px; height: 100vh; box-sizing: border-box; overflow: hidden; }
    .main-area { flex: 1; display: flex; flex-direction: column; gap: 15px; overflow: hidden; height: 100%; }
    
    .side-panel { width: 400px; background: var(--panel-bg); padding: 20px; border-radius: 8px; overflow-y: auto; height: 100%; box-sizing: border-box; display: flex; flex-direction: column; gap: 15px; }
    
    #drop-zone { border: 2px dashed #666; border-radius: 8px; padding: 20px; text-align: center; color: #aaa; cursor: pointer; transition: background 0.2s; flex-shrink: 0; }
    #drop-zone.dragover { background: #3a3a3a; border-color: var(--accent); }
    .canvas-container { flex: 1; overflow: auto; text-align: center; display: flex; align-items: center; justify-content: center; background: #111; border-radius: 8px; padding: 10px; }
    canvas { background: #000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); transition: max-width 0.2s, max-height 0.2s; }
    canvas.fit-view { max-width: 100%; max-height: 100%; object-fit: contain; }
    .control-group { border-bottom: 1px solid #444; padding-bottom: 15px; flex-shrink: 0; }
    .control-group h3 { margin: 0 0 10px 0; font-size: 14px; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
    label { display: block; margin-bottom: 5px; font-size: 13px; }
    input[type="text"], select, input[type="range"], textarea { width: 100%; box-sizing: border-box; padding: 8px; background: #1a1a1a; border: 1px solid #555; color: white; border-radius: 4px; margin-bottom: 8px; font-family: sans-serif; }
    textarea { resize: vertical; min-height: 110px; }
    .flex-row { display: flex; gap: 8px; align-items: center; margin-bottom: 6px; }
    .flex-row input[type="text"] { margin-bottom: 0; }
    button { width: 100%; padding: 12px; background: var(--accent); color: white; border: none; border-radius: 4px; font-size: 16px; cursor: pointer; font-weight: bold; margin-bottom: 10px; flex-shrink: 0; }
    button:hover { background: #357abd; }
    #btn-zip-download { background: #e27a4a; }
    #btn-zip-download:hover { background: #bd6235; }
    .file-switcher { font-size: 12px; color: #aaa; text-align: center; margin-bottom: 8px; }
    
    /* バナー＆X（Twitter）リンクエリア */
    .promo-section {
      border-top: 1px solid #444;
      padding-top: 15px;
      text-align: center;
      flex-shrink: 0;
      margin-bottom: 10px;
    }
    .promo-banner {
      width: 100%;
      border: 1px solid #555;
      border-radius: 6px;
      overflow: hidden;
      display: block;
      margin-bottom: 10px;
      text-decoration: none;
      line-height: 0;
    }
    .promo-banner img {
      width: 100%;
      height: auto;
      display: block;
    }
    .twitter-link {
      display: inline-block;
      color: #fff;
      background: #000000;
      border: 1px solid #555;
      padding: 10px 15px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 14px;
      font-weight: bold;
      width: 100%;
      box-sizing: border-box;
      transition: background 0.2s;
    }
    .twitter-link:hover {
      background: #222;
      border-color: #777;
    }
  </style>
</head>
<body>

<div class="main-area">
  <div id="drop-zone">ここに複数の写真をドロップ (またはクリックして選択)</div>
  <input type="file" id="file-input" multiple accept="image/png, image/jpeg" style="display:none;">
  <div class="file-switcher" id="file-counter" style="display:none;">プレビュー中: 1 / 1枚 (クリックで切り替え)</div>
  <div class="canvas-container">
    <canvas id="preview-canvas" class="fit-view"></canvas>
  </div>
  <label class="flex-row" style="justify-content: center;">
    <input type="checkbox" id="check-actual-size"> サンプルを原寸表示にする
  </label>
</div>

<div class="side-panel">
  <div class="control-group">
    <h3>
      <span>テキスト情報</span>
      <span id="current-file-name" style="font-size:11px; color:#888; font-weight:normal;"></span>
    </h3>
    <label class="flex-row"><input type="checkbox" id="check-show-date"> 日時 (表示用)</label>
    <input type="text" id="input-date" placeholder="例: 2026/09/08 02:19">
    <label class="flex-row"><input type="checkbox" id="check-show-world"> ワールド名</label>
    <input type="text" id="input-world" placeholder="Unknown World">
    <label class="flex-row"><input type="checkbox" id="check-show-comment"> 一言コメント</label>
    <input type="text" id="input-comment" placeholder="デフォルトは空">
    <label class="flex-row"><input type="checkbox" id="check-inline-layout"> 日時・ワールド名・コメントを一行にする</label>
  </div>

  <div class="control-group">
    <h3>フォント・スタイル設定</h3>
    <select id="select-font-preset">
      <option value='"UD Digi Kyokasho N-R", "UD デジタル 教科書体 N-R", sans-serif'>かわいい教科書体 (Win11標準)</option>
      <option value='"Kiwi Maru", "Motoya L Maru", "ヒラギノ丸ゴ ProN", sans-serif'>丸ゴシック系</option>
      <option value='"Meiryo", "メイリオ", sans-serif'>メイリオ (読みやすい)</option>
      <option value='sans-serif'>標準ゴシック</option>
      <option value='serif'>標準明朝</option>
      <option value='custom'>ローカルフォント名で指定...</option>
    </select>
    <input type="text" id="input-custom-font" placeholder="フォント名を入力 (例: 'Yuruka')" style="display:none;">
    
    <div class="flex-row" style="margin-top:8px;">
      <label style="flex:1;">文字カラー:</label>
      <input type="color" id="input-font-color" value="#ffffff" style="width:60px; height:32px; padding:0; border:none; background:none; cursor:pointer;">
    </div>
    <label class="flex-row"><input type="checkbox" id="check-bold" checked> 太字にする (Bold)</label>
    <label class="flex-row"><input type="checkbox" id="check-shadow" checked> 影をつける (Shadow)</label>

    <label style="margin-top:8px;">配置位置</label>
    <select id="select-position">
      <option value="bottom-left">左下</option>
      <option value="bottom-right">右下</option>
      <option value="top-left">左上</option>
      <option value="top-right">右上</option>
    </select>
    <label>テキストサイズ (基準比: <span id="val-size">3</span>%)</label>
    <input type="range" id="slider-size" min="1" max="20" step="1" value="3">
  </div>

  <div class="control-group">
    <h3>フレーム設定 (プロシージャル生成)</h3>
    <label class="flex-row"><input type="checkbox" id="check-white-frame"> 外側に白い余白枠をつける</label>
    <label>余白の大きさ: <span id="val-margin">3</span>%</label>
    <input type="range" id="slider-margin" min="1" max="15" step="1" value="3" disabled>
    <label class="flex-row"><input type="checkbox" id="check-text-in-margin" disabled> 余白の中にテキストを配置する</label>

    <label class="flex-row" style="margin-top:15px;"><input type="checkbox" id="check-overlay-frame"> デザインフレームを描画する</label>
    <select id="select-overlay" disabled>
      <option value="none">選択してください</option>
      <option value="gothic">1. ゴシック (黒/紅の二重線)</option>
      <option value="jirai">2. 地雷系・量産型 (ピンク破線/ハート)</option>
      <option value="yamikawa">3. 病みかわ (紫ノイズ/包帯風)</option>
      <option value="ruin">4. 退廃的・廃墟 (グランジフレーム)</option>
      <option value="dreamy">5. ドリーミー (パステルグラデーション)</option>
      <option value="fantasy">6. ファンタジー (ゴールド装飾)</option>
      <option value="retro">7. レトロ・ノスタルジック (ビネット)</option>
      <option value="natural">8. ナチュラル (アースカラー/二重線)</option>
      <option value="cyber_hud">9. サイバー・HUD (HUDマーカー)</option>
      <option value="cyber_neon">10. サイバー・ネオン (ネオン発光)</option>
      <option value="street">11. ストリート (ハザードストライプ)</option>
      <option value="cinematic_bar">12. シネマチック・シネスコ (上下黒帯)</option>
      <option value="cinematic_film">13. シネマチック・フィルム (フィルムロール)</option>
    </select>
  </div>

  <div class="control-group">
    <h3>フィルター (色調補正)</h3>
    <label>くっきり (コントラスト): <span id="val-crisp">0</span>%</label>
    <input type="range" id="slider-crisp" min="0" max="100" step="5" value="0">
    <label>暖かくする (Warm): <span id="val-warm">0</span>%</label>
    <input type="range" id="slider-warm" min="0" max="100" step="5" value="0">
    <label>クールにする (Cool): <span id="val-cool">0</span>%</label>
    <input type="range" id="slider-cool" min="0" max="100" step="5" value="0">
  </div>

  <div class="control-group">
    <h3>プロパティコメント設定</h3>
    <label class="flex-row"><input type="checkbox" id="check-auto-prop" checked> メタデータからワールド情報を自動反映する</label>
    <label>コメント欄 (メモ・プロパティ用):</label>
    <textarea id="input-property-comment" placeholder="VRC world: ワールド名&#10;URL: https://vrchat.com/home/world/wrld_...&#10;author: &#10;costume: &#10;shop: "></textarea>
    <label class="flex-row" style="margin-top: 8px;"><input type="checkbox" id="check-save-txt" checked> 同じ名前のテキストファイル(.txt)も一緒に保存する</label>
  </div>

  <div class="control-group">
    <h3>ファイル名設定</h3>
    <label class="flex-row"><input type="checkbox" id="check-file-worldname"> ファイル名にワールド名を含める</label>
    <label class="flex-row"><input type="checkbox" id="check-file-worldid"> ファイル名にワールドIDを含める</label>
  </div>

  <button id="btn-download">表示中の1枚をダウンロード</button>
  <button id="btn-zip-download" style="display:none;">全枚数をZIPで一括保存</button>

  <div class="promo-section">
    <a href="https://twitter.com/futaba_to_siaki" target="_blank" class="promo-banner">
      <img src="banner.png" alt="フタバとシアキの工房">
    </a>
    <a href="https://twitter.com/futaba_to_siaki" target="_blank" class="twitter-link">
      これ置いた人の𝕏
    </a>
  </div>
</div>

<script>
  const state = { items: [], currentIndex: 0 };

  const els = {
    dropZone: document.getElementById('drop-zone'), fileInput: document.getElementById('file-input'),
    canvas: document.getElementById('preview-canvas'), ctx: document.getElementById('preview-canvas').getContext('2d'),
    actualSize: document.getElementById('check-actual-size'),
    fileCounter: document.getElementById('file-counter'), fileNameDisplay: document.getElementById('current-file-name'),
    showDate: document.getElementById('check-show-date'), date: document.getElementById('input-date'),
    showWorld: document.getElementById('check-show-world'), world: document.getElementById('input-world'),
    showComment: document.getElementById('check-show-comment'), comment: document.getElementById('input-comment'),
    inlineLayout: document.getElementById('check-inline-layout'), 
    autoProp: document.getElementById('check-auto-prop'), propComment: document.getElementById('input-property-comment'),
    saveTxt: document.getElementById('check-save-txt'),
    fileWorldName: document.getElementById('check-file-worldname'), fileWorldId: document.getElementById('check-file-worldid'),
    fontPreset: document.getElementById('select-font-preset'), customFont: document.getElementById('input-custom-font'),
    fontColor: document.getElementById('input-font-color'), bold: document.getElementById('check-bold'), shadow: document.getElementById('check-shadow'),
    position: document.getElementById('select-position'), size: document.getElementById('slider-size'),
    whiteFrame: document.getElementById('check-white-frame'), marginSize: document.getElementById('slider-margin'),
    textInMargin: document.getElementById('check-text-in-margin'),
    overlayFrame: document.getElementById('check-overlay-frame'), overlaySelect: document.getElementById('select-overlay'),
    crisp: document.getElementById('slider-crisp'), warm: document.getElementById('slider-warm'), cool: document.getElementById('slider-cool'),
    btnDownload: document.getElementById('btn-download'), btnZipDownload: document.getElementById('btn-zip-download')
  };

  const syncVal = (id) => { document.getElementById(`val-${id}`).innerText = els[id === 'marginSize' ? 'marginSize' : id].value; };
  const addTrigger = (element, isInput = false) => {
    element.addEventListener(isInput ? 'input' : 'change', () => {
      if (element.type === 'range') syncVal(element.id.split('-').pop());
      if (state.items.length > 0) {
        const current = state.items[state.currentIndex];
        current.date = els.date.value;
        current.world = els.world.value;
      }
      updateCanvas();
    });
  };

  ['date', 'world', 'comment', 'customFont', 'fontColor', 'propComment'].forEach(id => addTrigger(els[id], true));
  ['showDate', 'showWorld', 'showComment', 'inlineLayout', 'autoProp', 'saveTxt', 'fileWorldName', 'fileWorldId', 'bold', 'shadow', 'position', 'whiteFrame', 'textInMargin', 'overlayFrame', 'overlaySelect', 'fontPreset'].forEach(id => addTrigger(els[id], false));
  ['size', 'marginSize', 'crisp', 'warm', 'cool'].forEach(id => addTrigger(els[id], true));

  els.actualSize.addEventListener('change', e => { els.canvas.className = e.target.checked ? '' : 'fit-view'; });
  els.fontPreset.addEventListener('change', e => { els.customFont.style.display = e.target.value === 'custom' ? 'block' : 'none'; updateCanvas(); });
  els.whiteFrame.addEventListener('change', e => { els.marginSize.disabled = !e.target.checked; els.textInMargin.disabled = !e.target.checked; updateCanvas(); });
  els.overlayFrame.addEventListener('change', e => { els.overlaySelect.disabled = !e.target.checked; updateCanvas(); });

  els.dropZone.addEventListener('click', () => els.fileInput.click());
  els.dropZone.addEventListener('dragover', e => { e.preventDefault(); els.dropZone.classList.add('dragover'); });
  els.dropZone.addEventListener('dragleave', () => els.dropZone.classList.remove('dragover'));
  els.dropZone.addEventListener('drop', e => { e.preventDefault(); els.dropZone.classList.remove('dragover'); handleFiles(e.dataTransfer.files); });
  els.fileInput.addEventListener('change', e => handleFiles(e.target.files));

  async function handleFiles(files) {
    if (files.length === 0) return;
    const fileArray = Array.from(files);
    state.items = [];
    state.currentIndex = 0;

    for (const file of fileArray) {
      const meta = await parseVRChatMetadata(file);
      const img = await loadImageAsync(file);
      state.items.push({
        file: file, img: img, originalName: file.name,
        date: meta.date, world: meta.world, worldId: meta.worldId
      });
    }

    if (state.items.length > 1) {
      els.fileCounter.style.display = 'block';
      els.fileCounter.innerText = `プレビュー中: 1 / ${state.items.length}枚 (クリックで切り替え)`;
      els.btnZipDownload.style.display = 'block';
      els.btnZipDownload.innerText = `全 ${state.items.length} 枚をZIPで一括保存`;
    } else {
      els.fileCounter.style.display = 'none';
      els.btnZipDownload.style.display = 'none';
    }

    loadCurrentItemToUI();
  }

  els.canvas.addEventListener('click', () => {
    if (state.items.length <= 1) return;
    state.currentIndex = (state.currentIndex + 1) % state.items.length;
    els.fileCounter.innerText = `プレビュー中: ${state.currentIndex + 1} / ${state.items.length}枚`;
    loadCurrentItemToUI();
  });

  function loadCurrentItemToUI() {
    if (state.items.length === 0) return;
    const current = state.items[state.currentIndex];
    els.date.value = current.date;
    els.world.value = current.world;
    els.fileNameDisplay.innerText = `(${current.originalName})`;

    if (els.autoProp.checked) {
      const worldUrl = current.worldId ? `https://vrchat.com/home/world/${current.worldId}` : '';
      els.propComment.value = `VRC world: ${current.world}\nURL: ${worldUrl}\nauthor: \ncostume: \nshop: `;
    }

    updateCanvas();
  }

  async function parseVRChatMetadata(file) {
    let resultWorld = "Unknown World";
    let resultDate = "2026/09/08 00:00";
    let resultWorldId = "";

    try {
      const buffer = await file.arrayBuffer();
      const textDecoder = new TextDecoder('utf-8', { fatal: false });
      const fullText = textDecoder.decode(buffer);

      const worldMatch = fullText.match(/Worlddisplayname[>:\s"]+([^<"&]+)/i) || fullText.match(/<vrc:Worlddisplayname>(.*?)<\/vrc:Worlddisplayname>/i);
      if (worldMatch && worldMatch[1]) {
        let rawWorld = worldMatch[1].trim().replace(/Ã[^"]*?/g, '').replace(/[^\x20-\x7E\u3000-\u30FF\u4E00-\u9FFF]/g, '');
        if (rawWorld) resultWorld = rawWorld;
      }

      const idMatch = fullText.match(/Worldid[>:\s"]+(wrld_[a-fA-F0-9\-]+)/i) || fullText.match(/(wrld_[a-fA-F0-9\-]{36})/i);
      if (idMatch && idMatch[1]) {
        resultWorldId = idMatch[1].trim();
      }

      const dateMatch = fullText.match(/CreateDate[>:\s"]+([\dT:\+\-\s]+)/i) || fullText.match(/(\d{4}):(\d{2}):(\d{2})[T\s](\d{2}):(\d{2}):(\d{2})/);
      if (dateMatch && dateMatch[1]) {
        const dateStr = dateMatch[1].trim();
        const ymdMatch = dateStr.match(/(\d{4})[:\-](\d{2})[:\-](\d{2})[T\s](\d{2}):(\d{2})/);
        if (ymdMatch) {
          resultDate = `${ymdMatch[1]}/${ymdMatch[2]}/${ymdMatch[3]} ${ymdMatch[4]}:${ymdMatch[5]}`;
        }
      } else {
        const fnMatch = file.name.match(/VRChat_(\d{4})-(\d{2})-(\d{2})_(\d{2})-(\d{2})-(\d{2})/);
        if (fnMatch) resultDate = `${fnMatch[1]}/${fnMatch[2]}/${fnMatch[3]} ${fnMatch[4]}:${fnMatch[5]}`;
      }
    } catch (e) {
      console.warn("メタデータ解析失敗:", e);
    }
    return { date: resultDate, world: resultWorld, worldId: resultWorldId };
  }

  function generateFilename(item) {
    const originalName = item.originalName;
    const worldName = item.world;
    const worldId = item.worldId;

    const match = originalName.match(/VRChat_(\d{4}-\d{2}-\d{2})_(\d{2}-\d{2}-\d{2})/);
    let baseDate = "2026-09-08-00-00-00";
    if (match) baseDate = `${match[1]}-${match[2]}`;
    
    let nameParts = [baseDate];
    
    if (els.fileWorldName.checked) {
      const safeWorldName = (worldName || "").trim().replace(/[\\\/:*?"<>|]/g, '');
      if (safeWorldName) nameParts.push(safeWorldName);
    }
    
    if (els.fileWorldId.checked && worldId) {
      nameParts.push(worldId);
    }

    return nameParts.join('_') + '.png';
  }

  function loadImageAsync(file) {
    return new Promise((resolve) => {
      const reader = new FileReader();
      reader.onload = (e) => { const img = new Image(); img.onload = () => resolve(img); img.src = e.target.result; };
      reader.readAsDataURL(file);
    });
  }

  function drawProceduralFrame(ctx, type, cw, ch, p, w, h) {
    const shortSide = Math.min(w, h);
    ctx.save();
    ctx.translate(p, p); 
    const lw = Math.max(2, shortSide * 0.005);
    const m = shortSide * 0.03;

    switch(type) {
      case 'gothic':
        ctx.strokeStyle = '#111111'; ctx.lineWidth = lw * 4; ctx.strokeRect(m, m, w - m*2, h - m*2);
        ctx.strokeStyle = '#8b0000'; ctx.lineWidth = lw; ctx.strokeRect(m, m, w - m*2, h - m*2);
        ctx.fillStyle = '#8b0000'; ctx.font = `${shortSide*0.05}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ['m,m','w-m,m','m,h-m','w-m,h-m'].forEach(pos => {
          const [px, py] = pos.replace('w', w).replace('h', h).split(',').map(eval);
          ctx.fillText('†', px, py);
        });
        break;
      case 'jirai':
        ctx.strokeStyle = '#000000'; ctx.lineWidth = lw * 3; ctx.strokeRect(m, m, w - m*2, h - m*2);
        ctx.strokeStyle = '#ffb6c1'; ctx.lineWidth = lw * 1.5; ctx.setLineDash([lw*4, lw*4]); ctx.strokeRect(m, m, w - m*2, h - m*2);
        ctx.setLineDash([]); ctx.fillStyle = '#ffb6c1'; ctx.font = `${shortSide*0.05}px sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ['m,m','w-m,m','m,h-m','w-m,h-m'].forEach(pos => {
          const [px, py] = pos.replace('w', w).replace('h', h).split(',').map(eval);
          ctx.fillText('♥', px, py);
        });
        break;
      case 'yamikawa':
        ctx.strokeStyle = 'rgba(128, 0, 128, 0.8)'; ctx.lineWidth = lw * 5; ctx.strokeRect(m, m, w - m*2, h - m*2);
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.9)'; ctx.lineWidth = lw * 2; ctx.strokeRect(m + lw, m + lw, w - (m+lw)*2, h - (m+lw)*2);
        ctx.fillStyle = 'rgba(128, 0, 128, 0.6)';
        for(let i=0; i<10; i++) ctx.fillRect(m + Math.random()*(w-m*2), m, lw*2, shortSide*0.1 + Math.random()*shortSide*0.1);
        break;
      case 'ruin':
        ctx.strokeStyle = '#444'; ctx.lineWidth = lw * 2;
        ctx.beginPath();
        for(let i=0; i<w; i+=lw*5) { ctx.lineTo(i, (Math.random()-0.5)*lw*3); }
        for(let i=0; i<h; i+=lw*5) { ctx.lineTo(w + (Math.random()-0.5)*lw*3, i); }
        for(let i=w; i>0; i-=lw*5) { ctx.lineTo(i, h + (Math.random()-0.5)*lw*3); }
        for(let i=h; i>0; i-=lw*5) { ctx.lineTo((Math.random()-0.5)*lw*3, i); }
        ctx.closePath(); ctx.stroke();
        break;
      case 'dreamy':
        const grad = ctx.createLinearGradient(0, 0, w, h);
        grad.addColorStop(0, 'rgba(255, 182, 193, 0.6)'); grad.addColorStop(1, 'rgba(173, 216, 230, 0.6)');
        ctx.strokeStyle = grad; ctx.lineWidth = lw * 8;
        ctx.beginPath(); ctx.roundRect(m, m, w - m*2, h - m*2, shortSide*0.05); ctx.stroke();
        break;
      case 'fantasy':
        ctx.strokeStyle = '#ffd700'; ctx.lineWidth = lw;
        ctx.strokeRect(m, m, w - m*2, h - m*2); ctx.strokeRect(m + lw*3, m + lw*3, w - (m+lw*3)*2, h - (m+lw*3)*2);
        ctx.fillStyle = '#ffd700';
        ['m,m','w-m,m','m,h-m','w-m,h-m'].forEach(pos => {
          const [px, py] = pos.replace('w', w).replace('h', h).split(',').map(eval);
          ctx.beginPath(); ctx.arc(px, py, lw*3, 0, Math.PI*2); ctx.fill();
        });
        break;
      case 'retro':
        const rGrad = ctx.createRadialGradient(w/2, h/2, shortSide*0.3, w/2, h/2, shortSide*0.7);
        rGrad.addColorStop(0, 'rgba(0,0,0,0)'); rGrad.addColorStop(1, 'rgba(60,40,20,0.6)');
        ctx.fillStyle = rGrad; ctx.fillRect(0, 0, w, h);
        break;
      case 'natural':
        ctx.strokeStyle = '#8fbc8f'; ctx.lineWidth = lw * 2; ctx.strokeRect(m, m, w - m*2, h - m*2);
        ctx.lineWidth = lw; ctx.strokeRect(m + lw*4, m + lw*4, w - (m+lw*4)*2, h - (m+lw*4)*2);
        break;
      case 'cyber_hud':
        ctx.strokeStyle = '#00ffff'; ctx.lineWidth = lw;
        const cl = shortSide * 0.1;
        ctx.beginPath();
        ctx.moveTo(m, m+cl); ctx.lineTo(m, m); ctx.lineTo(m+cl, m);
        ctx.moveTo(w-m-cl, m); ctx.lineTo(w-m, m); ctx.lineTo(w-m, m+cl);
        ctx.moveTo(w-m, h-m-cl); ctx.lineTo(w-m, h-m); ctx.lineTo(w-m-cl, h-m);
        ctx.moveTo(m+cl, h-m); ctx.lineTo(m, h-m); ctx.lineTo(m, h-m-cl);
        ctx.moveTo(w/2 - cl, h/2); ctx.lineTo(w/2 + cl, h/2);
        ctx.moveTo(w/2, h/2 - cl); ctx.lineTo(w/2, h/2 + cl);
        ctx.stroke();
        break;
      case 'cyber_neon':
        ctx.strokeStyle = '#ff00ff'; ctx.lineWidth = lw * 2; ctx.shadowColor = '#ff00ff'; ctx.shadowBlur = lw * 5;
        ctx.strokeRect(m, m, w - m*2, h - m*2);
        ctx.strokeStyle = '#00ffff'; ctx.strokeRect(m + lw*4, m + lw*4, w - (m+lw*4)*2, h - (m+lw*4)*2);
        ctx.shadowBlur = 0;
        break;
      case 'street':
        ctx.save();
        ctx.beginPath();
        ctx.rect(m, m, w - m*2, h - m*2);
        const innerMargin = m + lw * 4;
        ctx.rect(innerMargin, innerMargin, w - innerMargin * 2, h - innerMargin * 2);
        ctx.clip('evenodd');
        ctx.fillStyle = '#ffcc00';
        ctx.fillRect(m, m, w - m*2, h - m*2);
        ctx.fillStyle = '#000000';
        for(let i = -w; i < w * 2; i += lw * 8) {
          ctx.beginPath();
          ctx.moveTo(i, 0);
          ctx.lineTo(i + lw * 4, 0);
          ctx.lineTo(i - h + lw * 4, h);
          ctx.lineTo(i - h, h);
          ctx.fill();
        }
        ctx.restore();
        break;
      case 'cinematic_bar':
        const targetRatio = 2.35; const currentRatio = w / h;
        ctx.fillStyle = '#000000';
        if (currentRatio < targetRatio) {
          const barH = (h - (w / targetRatio)) / 2;
          ctx.fillRect(0, 0, w, barH); ctx.fillRect(0, h - barH, w, barH);
        } else {
          const barW = (w - (h * targetRatio)) / 2;
          ctx.fillRect(0, 0, barW, h); ctx.fillRect(w - barW, 0, barW, h);
        }
        break;
      case 'cinematic_film':
        const fBar = shortSide * 0.1;
        ctx.fillStyle = '#111'; ctx.fillRect(0, 0, fBar, h); ctx.fillRect(w - fBar, 0, fBar, h);
        ctx.fillStyle = '#fff';
        for(let i=fBar; i<h; i+=fBar) {
          ctx.beginPath(); ctx.roundRect(fBar*0.2, i, fBar*0.6, fBar*0.5, fBar*0.1); ctx.fill();
          ctx.beginPath(); ctx.roundRect(w - fBar*0.8, i, fBar*0.6, fBar*0.5, fBar*0.1); ctx.fill();
        }
        break;
    }
    ctx.restore();
  }

  function updateCanvas(ctxToUse = els.ctx, itemOverride = null) {
    const targetItem = itemOverride || (state.items.length > 0 ? state.items[state.currentIndex] : null);
    if (!targetItem || !targetItem.img) return;

    const ctx = ctxToUse;
    const isPreview = (ctx === els.ctx);
    const imgToUse = targetItem.img;
    
    const shortSide = Math.min(imgToUse.width, imgToUse.height);
    const marginRatio = parseInt(els.marginSize.value) / 100;
    const padding = els.whiteFrame.checked ? shortSide * marginRatio : 0;
    
    const cw = imgToUse.width + (padding * 2);
    const ch = imgToUse.height + (padding * 2);
    
    if (isPreview) { els.canvas.width = cw; els.canvas.height = ch; } 
    else { ctx.canvas.width = cw; ctx.canvas.height = ch; }
    
    if (els.whiteFrame.checked) { ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, cw, ch); } 
    else { ctx.clearRect(0, 0, cw, ch); }

    const crispVal = parseInt(els.crisp.value);
    if (crispVal > 0) ctx.filter = `contrast(${100 + crispVal}%) saturate(${100 + (crispVal * 0.5)}%)`;
    ctx.drawImage(imgToUse, padding, padding, imgToUse.width, imgToUse.height);
    ctx.filter = 'none';

    const warmVal = parseInt(els.warm.value); const coolVal = parseInt(els.cool.value);
    if (warmVal > 0 || coolVal > 0) {
      ctx.globalCompositeOperation = 'soft-light';
      if (warmVal > 0) { ctx.globalAlpha = warmVal / 100; ctx.fillStyle = '#ff8800'; ctx.fillRect(padding, padding, imgToUse.width, imgToUse.height); }
      if (coolVal > 0) { ctx.globalAlpha = coolVal / 100; ctx.fillStyle = '#0066ff'; ctx.fillRect(padding, padding, imgToUse.width, imgToUse.height); }
      ctx.globalAlpha = 1.0; ctx.globalCompositeOperation = 'source-over';
    }

    if (els.overlayFrame.checked && els.overlaySelect.value !== 'none') {
      drawProceduralFrame(ctx, els.overlaySelect.value, cw, ch, padding, imgToUse.width, imgToUse.height);
    }

    const dateVal = isPreview ? els.date.value : targetItem.date;
    const worldVal = isPreview ? els.world.value : targetItem.world;
    const commentVal = els.comment.value;

    const parts = [];
    if (els.showDate.checked && dateVal) parts.push(dateVal);
    if (els.showWorld.checked && worldVal) parts.push(worldVal);
    if (els.showComment.checked && commentVal) parts.push(commentVal);

    if (parts.length === 0) return;

    const textLines = els.inlineLayout.checked ? [parts.join('  ')] : parts;

    let fontFamily = els.fontPreset.value;
    if (fontFamily === 'custom') fontFamily = els.customFont.value || 'sans-serif';
    
    const fontSize = shortSide * (parseInt(els.size.value) / 100);
    const boldStr = els.bold.checked ? 'bold ' : '';
    ctx.font = `${boldStr}${fontSize}px ${fontFamily}`;
    
    const putInMargin = els.whiteFrame.checked && els.textInMargin.checked;
    ctx.fillStyle = els.fontColor.value;
    
    if (els.shadow.checked) {
      ctx.shadowColor = els.whiteFrame.checked ? 'rgba(0,0,0,0.4)' : 'rgba(0,0,0,0.8)';
      ctx.shadowBlur = fontSize * 0.3;
      ctx.shadowOffsetX = fontSize * 0.05;
      ctx.shadowOffsetY = fontSize * 0.05;
    } else {
      ctx.shadowColor = 'transparent';
    }

    ctx.textBaseline = 'top';
    let startX, startY;
    const marginX = padding + (shortSide * 0.03); const marginY = padding + (shortSide * 0.03);
    const lineHeight = fontSize * 1.3; const totalTextHeight = textLines.length * lineHeight;
    const pos = els.position.value;
    
    if (pos.includes('left')) { startX = putInMargin ? (padding * 0.5) : marginX; ctx.textAlign = 'left'; } 
    else { startX = putInMargin ? cw - (padding * 0.5) : cw - marginX; ctx.textAlign = 'right'; }

    if (pos.includes('top')) { startY = putInMargin ? (padding / 2) - (totalTextHeight / 2) : marginY; } 
    else { startY = putInMargin ? ch - (padding / 2) - (totalTextHeight / 2) : ch - marginY - totalTextHeight; }

    textLines.forEach((text, index) => { ctx.fillText(text, startX, startY + (index * lineHeight)); });
  }

  els.btnDownload.addEventListener('click', async () => {
    if (state.items.length === 0) return alert("画像を読み込んでください");
    try {
      const current = state.items[state.currentIndex];
      const dlName = generateFilename(current);
      
      const blob = await new Promise(resolve => els.canvas.toBlob(resolve, 'image/png'));

      // 画像のダウンロード
      const link = document.createElement('a'); 
      link.download = dlName; 
      link.href = URL.createObjectURL(blob); 
      link.click();

      // テキストファイルの同時ダウンロード
      if (els.saveTxt.checked && els.propComment.value.trim() !== "") {
        const txtName = dlName.replace(/\.png$/, '.txt');
        const txtBlob = new Blob([els.propComment.value], { type: 'text/plain;charset=utf-8' });
        const txtLink = document.createElement('a');
        txtLink.download = txtName;
        txtLink.href = URL.createObjectURL(txtBlob);
        setTimeout(() => {
          txtLink.click();
        }, 300);
      }
    } catch (e) {
      console.error(e);
      alert("ダウンロード処理中にエラーが発生しました。");
    }
  });

  els.btnZipDownload.addEventListener('click', async () => {
    if (state.items.length === 0) return;
    const zip = new JSZip();
    const originalText = els.btnZipDownload.innerText;
    els.btnZipDownload.innerText = "ZIP生成中... (お待ちください)"; els.btnZipDownload.disabled = true;

    try {
      const firstItem = state.items[0];
      const match = firstItem.originalName.match(/VRChat_(\d{4}-\d{2}-\d{2})_(\d{2}-\d{2}-\d{2})/);
      let zipBaseDate = "Photos";
      if (match) {
        zipBaseDate = `${match[1]}-${match[2]}`;
      }

      const offCanvas = document.createElement('canvas'); const offCtx = offCanvas.getContext('2d');
      for (const item of state.items) {
        updateCanvas(offCtx, item);
        const blob = await new Promise(resolve => offCanvas.toBlob(resolve, 'image/png'));
        const pngName = generateFilename(item);
        zip.file(pngName, blob);

        // ZIP内にもテキストファイルを同梱
        if (els.saveTxt.checked && els.propComment.value.trim() !== "") {
          const txtName = pngName.replace(/\.png$/, '.txt');
          zip.file(txtName, els.propComment.value);
        }
      }

      const zipBlob = await zip.generateAsync({ type: 'blob' });
      const link = document.createElement('a'); 
      link.download = `VRC_${zipBaseDate}.zip`;
      link.href = URL.createObjectURL(zipBlob); 
      link.click();
    } catch (e) {
      console.error(e);
      alert("ZIP生成中にエラーが発生しました。");
    } finally {
      els.btnZipDownload.innerText = originalText; 
      els.btnZipDownload.disabled = false;
    }
  });
</script>
</body>
